map "$host:$uri" $modo_public_entry {
    default 0;
    "192.168.0.225:/" 1;
    "192.168.0.225:/src/main" 1;
    "192.168.0.225:/src/main/" 1;
    "192.168.0.225:/src/main/index.html" 1;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/pirohanet/current;

    if ($modo_public_entry) {
        return 302 https://piro4.hjpark.net/${is_args}${args};
    }

    location = / {
        try_files /src/main/index.html =404;
    }

    location = /src/main/ {
        try_files /src/main/index.html =404;
    }

    location ~ ^/(demo\.html|calendar\.js|sample\.js|location\.js)$ {
        rewrite ^/(.*)$ /src/calendar/$1 redirect;
    }

    location ~ ^/src/(main|calendar|map|places|preferences|routing)/[a-z0-9-]+\.(html|css|js|json)$ {
        try_files $uri =404;
    }

    location = /assets/map-config.json {
        alias /var/www/pirohanet/map-config.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location ~ ^/(assets|fonts)/[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*\.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    location ~ ^/(api/(account|calendar|calendar-condition|saved-places|geocode|place|reverse-geocode|transit|walk|bus-information)|auth/(google(/callback)?|logout))$ {
        proxy_pass http://[::1]:5173;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
