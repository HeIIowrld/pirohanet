name: Deploy to yccthon

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: deploy-yccthon
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish static files
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Publish the main commit
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = yccthon
          test "$(hostname -s)" = yccthon
          test "$(id -un)" = github-runner
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

          deploy_dir=/var/www/pirohanet
          exec 9>"$deploy_dir/.deploy.lock"
          flock 9
          stage=$(mktemp -d "$deploy_dir/.deploy.XXXXXXXX")
          trap 'rm -rf -- "$stage"' EXIT
          mkdir "$stage/site"
          git -C "$stage" init --quiet
          git -C "$stage" fetch --quiet --no-tags --depth=1 \
            https://github.com/HeIIowrld/pirohanet.git refs/heads/main
          if [ "$(git -C "$stage" rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "main moved past $GITHUB_SHA; skipping this run."
            exit 0
          fi

          git -C "$stage" archive "$GITHUB_SHA" src | tar -x -C "$stage/site"
          mkdir "$stage/build"
          git -C "$stage" archive "$GITHUB_SHA" | tar -x -C "$stage/build"
          runner_node="/home/github-runner/actions-runner/externals/node24/bin"
          export PATH="$runner_node:$PATH"
          npm --prefix "$stage/build" ci --no-audit --no-fund
          npm --prefix "$stage/build" test
          npm --prefix "$stage/build" run build
          install -m 644 "$stage/build/dist/index.html" "$stage/site/src/main/index.html"
          cp -a "$stage/build/dist/assets" "$stage/build/dist/fonts" "$stage/site/"
          if [ -n "$(find "$stage/site" ! -type d ! -type f -print -quit)" ]; then
            echo "The published tree must contain only regular files and directories." >&2
            exit 1
          fi
          test -s "$stage/site/src/main/index.html"
          test -s "$stage/site/src/calendar/demo.html"
          chmod -R a+rX "$stage/site"

          for endpoint in transit walk bus-information; do
            code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "http://127.0.0.1/api/$endpoint")
            if [ "$code" != 400 ]; then
              echo "Expected coordinate validation at /api/$endpoint, got HTTP $code." >&2
              exit 1
            fi
          done
          curl -fsS --max-time 10 http://127.0.0.1/api/account | grep -F '"signedIn"' >/dev/null

          release="releases/$GITHUB_SHA"
          if [ ! -d "$deploy_dir/$release" ]; then
            mv -T -- "$stage/site" "$deploy_dir/$release"
          fi
          previous=$(readlink "$deploy_dir/current" || true)
          ln -s -- "$release" "$stage/next"
          mv -Tf -- "$stage/next" "$deploy_dir/current"
          check_published_file() {
            local url_path=$1 file_path=$2
            curl -fsS --max-time 10 -o "$stage/response" "http://127.0.0.1$url_path" \
              && cmp "$deploy_dir/$release/$file_path" "$stage/response"
          }
          bundle=$(sed -n 's/.*src="\/assets\/\([^"]*\.js\)".*/\1/p' "$deploy_dir/$release/src/main/index.html")
          if [ -z "$bundle" ] \
              || ! check_published_file /src/main/ src/main/index.html \
              || ! check_published_file "/assets/$bundle" "assets/$bundle" \
              || ! check_published_file /assets/brand/modo-wordmark.svg assets/brand/modo-wordmark.svg \
              || ! check_published_file /src/routing/transit.js src/routing/transit.js \
              || ! check_published_file /src/main/saved-places.js src/main/saved-places.js \
              || ! check_published_file /src/calendar/demo.html src/calendar/demo.html; then
            if [ -n "$previous" ]; then
              ln -s -- "$previous" "$stage/previous"
              mv -Tf -- "$stage/previous" "$deploy_dir/current"
            else
              rm -f -- "$deploy_dir/current"
            fi
            echo "Nginx did not return the expected deployed files." >&2
            exit 1
          fi
          echo "Deployed $GITHUB_SHA"
