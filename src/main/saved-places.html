<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f1">
  <title>내 장소 · 모도</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body hidden>
  <div class="app">
    <header class="app-header">
      <a href="./index.html">모도</a>
      <nav aria-label="주 메뉴">
        <a href="./index.html#schedule">일정</a>
        <a href="./saved-places.html" aria-current="page">내 장소</a>
      </nav>
    </header>
    <main>
      <section class="panel" aria-labelledby="saved-places-heading">
        <h1 id="saved-places-heading">내 장소</h1>
        <p id="saved-places-status" class="status" role="status">저장한 장소를 불러오는 중이에요.</p>
        <p id="saved-places-account" class="status" role="status">Google 계정이 연결됐어요.</p>
        <div class="account-actions">
          <button id="saved-places-login" type="button" class="secondary">Google 계정과 동기화</button>
          <button id="saved-places-logout" type="button" class="secondary">로그아웃</button>
        <div id="saved-place-add">
          <h2>장소 추가</h2>
          <form class="saved-place-edit">
            <input name="alias" aria-label="저장할 이름" placeholder="저장할 이름" maxlength="200" required>
            <input name="query" aria-label="장소 또는 주소" placeholder="장소 또는 주소" maxlength="200" required>
            <button class="secondary" type="submit">장소 검색</button>
          </form>
          <p class="status" role="status"></p>
          <div class="account-actions"></div>
        </div>
        <ul id="saved-place-list" hidden></ul>
      </section>
    </main>
  </div>
  <script>
    {
      // 시연 서버 앞의 Cloudflare가 JS를 4시간 캐시해서, 배포 직후에는 새 HTML이 옛 JS를 불러와 깨진다.
      // 그래서 이 페이지가 불러오는 모든 모듈 주소에 시각을 붙인다(import map은 모듈보다 먼저 문서에 있어야 한다).
      // 모듈을 추가로 import 하면 여기에도 넣는다. 하나라도 빠지면 그 파일만 옛 캐시가 온다.
      const modules = ['/src/main/saved-places.js', '/src/main/login-session.js', '/src/calendar/calendar.js', '/src/calendar/location.js'];
      const fresh = `?t=${Date.now()}`;
      const map = document.createElement('script');
      map.type = 'importmap';
      map.textContent = JSON.stringify({ imports: Object.fromEntries(modules.map((path) => [path, path + fresh])) });
      document.currentScript.after(map);
      import('/src/main/login-session.js').then(({ guardSession }) => {
        if (!guardSession()) return;
        document.body.hidden = false;
        return import('/src/main/saved-places.js');
      });
    }
  </script>
</body>
</html>
