<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f1">
  <title>모도</title>
  <link rel="stylesheet" href="./app.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>모도</h1>
      <nav aria-label="주 메뉴">
        <a href="#schedule">일정</a>
        <a href="./saved-places.html">내 장소</a>
      </nav>
    </header>

    <main>
      <form id="trip-form">
        <section class="panel" aria-labelledby="trip-heading">
          <h2 id="trip-heading">이동 계획</h2>
          <div class="fields">
            <label for="origin">출발지</label>
            <input id="origin" name="origin" type="text" required placeholder="장소 또는 주소">
            <label for="destination">목적지</label>
            <input id="destination" name="destination" type="text" required placeholder="장소 또는 주소">
            <label for="depart-at">출발 시각 (한국 시간)</label>
            <input id="depart-at" name="departAt" type="datetime-local">
            <label for="arrive-by">도착 목표 (한국 시간)</label>
            <input id="arrive-by" name="arriveBy" type="datetime-local">
            <label for="max-extra">추가 이동 허용 시간 (분)</label>
            <input id="max-extra" name="maxExtra" type="number" min="0" value="20" required>
            <label for="saved-stop">들를 장소</label>
            <select id="saved-stop" name="savedStop" aria-describedby="stop-description"><option value="">선택 안 함</option></select>
            <p id="stop-catalog-status" class="status" role="status" hidden></p>
            <div id="stop-info" hidden>
              <p id="stop-description" class="status"></p>
              <p id="stop-visit-note" class="status"></p>
              <a id="stop-source" class="stop-source" target="_blank" rel="noopener noreferrer">장소 안내</a>
            </div>
            <label for="stay-minutes">경유지 체류 시간 (분)</label>
            <input id="stay-minutes" name="stayMinutes" type="number" min="0" value="10" required>
          </div>
        </section>

        <section id="schedule" class="panel" aria-labelledby="schedule-heading">
          <div class="section-header">
            <h2 id="schedule-heading">일정</h2>
            <button id="load-sample" type="button" class="secondary">샘플 일정 불러오기</button>
          </div>
          <div class="account-actions">
            <button id="google-calendar" class="secondary" type="button">Google 일정 불러오기</button>
            <button id="logout" class="secondary" type="button" hidden>연결 끊기</button>
          </div>
          <p id="account-status" class="status" role="status" hidden></p>
          <p id="trip-summary" class="status" role="status">선택한 일정이 없어요.</p>
          <p id="departure-status" class="status" role="status" tabindex="-1" hidden></p>
          <div id="calendar-place-candidates" class="account-actions"></div>
          <button id="preview-departure" type="button" class="secondary departure-preview" hidden>출발 알림 미리보기</button>
        </section>

        <fieldset class="panel">
          <legend class="sr-only">오늘 컨디션</legend>
          <h2>오늘 컨디션</h2>
          <div class="options">
            <label><input type="radio" name="fatigue" value="1"><span>1점 · 괜찮아요</span></label>
            <label><input type="radio" name="fatigue" value="2"><span>2점 · 조금 피곤해요</span></label>
            <label><input type="radio" name="fatigue" value="3"><span>3점 · 피곤해요</span></label>
            <label><input type="radio" name="fatigue" value="4"><span>4점 · 많이 피곤해요</span></label>
            <label><input type="radio" name="fatigue" value="5"><span>5점 · 녹초예요</span></label>
          </div>
        <div class="fields">
          <label for="priority">이동 우선순위</label>
          <select id="priority" name="priority">
            <option value="">컨디션 기준</option>
            <option value="walking">덜 걷기</option>
            <option value="transfers">환승 줄이기</option>
            <option value="crowding">혼잡 피하기</option>
          </select>
          <label for="avoid-line">가능하면 피할 지하철 노선</label>
          <select id="avoid-line" name="avoidLine">
            <option value="">선택 안 함</option>
            <option value="1">1호선</option>
            <option value="2">2호선</option>
            <option value="3">3호선</option>
            <option value="4">4호선</option>
            <option value="5">5호선</option>
            <option value="6">6호선</option>
            <option value="7">7호선</option>
            <option value="8">8호선</option>
            <option value="9">9호선</option>
          </select>
        </div>
      </fieldset>

        <div class="form-actions">
          <button id="check-places" class="primary" type="submit">경로 찾기</button>
        </div>
      </form>

      <section class="panel" aria-labelledby="results-heading">
        <h2 id="results-heading" tabindex="-1">이동 결과</h2>
        <p id="route-status" class="status" role="status">출발지와 목적지를 입력하고 경로를 찾아보세요.</p>
        <dl id="confirmed-places" hidden>
          <dt>출발지</dt><dd id="origin-result"></dd>
          <dt>목적지</dt><dd id="destination-result"></dd>
        </dl>
        <div id="route-results"></div>
      </section>
    </main>
  </div>
  <div id="departure-announcement" class="sr-only" role="status"></div>
  <aside id="departure-card" class="departure-card" aria-labelledby="departure-heading" tabindex="-1" hidden>
    <div class="departure-header">
      <span class="departure-icon" aria-hidden="true"></span>
      <p id="departure-label">출발 알림</p>
      <button type="button" class="departure-close" aria-label="출발 알림 닫기">×</button>
    </div>
    <h2 id="departure-heading">지금 출발할 시간이에요</h2>
    <p id="departure-appointment" class="departure-appointment"></p>
    <p id="departure-location" class="status"></p>
    <p id="departure-timing" class="departure-timing"></p>
    <a class="primary departure-action" href="#results-heading" rel="noopener noreferrer">경로 보기</a>
  </aside>
  <script>
    // 시연 서버 앞의 Cloudflare가 JS를 4시간 캐시해서, 배포 직후에는 새 HTML이 옛 JS를 불러와 깨진다.
    // HTML은 캐시되지 않으므로, 여기서 import map으로 모듈 주소마다 시각을 붙여 항상 최신 코드를 받는다.
    {
      // main.js가 직접·간접으로 import 하는 모든 파일. 모듈을 추가로 import 하면 여기에도 넣는다.
      const modules = [
        '/src/main/main.js',
        '/src/main/route-results.js',
        '/src/main/bus-information.js',
        '/src/main/departure-reminder.js',
        '/src/places/recommended-stops.js',
        '/src/routing/transit.js',
        '/src/routing/crowding.js',
        '/src/main/trip.js',
        '/src/calendar/calendar.js',
        '/src/calendar/location.js',
        '/src/calendar/sample.js',
        '/src/map/places.js',
        '/src/preferences/preferences.js',
        '/src/routing/compare.js',
      ];
      const fresh = `?t=${Date.now()}`;
      const importMap = document.createElement('script');
      importMap.type = 'importmap';
      importMap.textContent = JSON.stringify({ imports: Object.fromEntries(modules.map((path) => [path, path + fresh])) });
      document.currentScript.after(importMap); // 모듈을 하나라도 불러오기 전에 문서에 있어야 한다
      import('/src/main/main.js');
    }
  </script>
</body>
</html>
